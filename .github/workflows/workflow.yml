name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOC_PWD }}" | docker login \
            -u "${{ secrets.DOC_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOC_USERNAME }}/github-actions-docker:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOC_USERNAME }}/github-actions-docker:latest

      - name: Deploy to Kubernetes
        run: |
          docker pull ${{ secrets.DOC_USERNAME }}/github-actions-docker:latest

          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: github-actions-docker
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: github-actions-docker
            template:
              metadata:
                labels:
                  app: github-actions-docker
              spec:
                containers:
                - name: app
                  image: ${{ secrets.DOC_USERNAME }}/github-actions-docker:latest
                  ports:
                  - containerPort: 80
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: github-actions-docker
          spec:
            type: NodePort
            selector:
              app: github-actions-docker
            ports:
            - port: 80
              targetPort: 80
              nodePort: 30080
          EOF

          kubectl rollout status deployment/github-actions-docker
