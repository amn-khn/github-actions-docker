name: Kubernetes CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOC_USERNAME }}
          password: ${{ secrets.DOC_PWD }}

      - name: Build Docker Image
        run: |
          docker build -t makdev85/githubactions:latest .

      - name: Push Docker Image
        run: |
          docker push makdev85/githubactions:latest

  deploy-kubernetes:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Verify Kubernetes Cluster
        run: kubectl get nodes

      - name: Update Deployment Image
        run: |
          kubectl set image deployment/cicd-app cicd-app=makdev85/githubactions:latest

      - name: Restart Deployment
        run: kubectl rollout restart deployment/cicd-app

      - name: Wait for Rollout
        run: kubectl rollout status deployment/cicd-app
