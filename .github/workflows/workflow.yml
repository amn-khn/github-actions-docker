name: Docker Kubernetes CI/CD

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.MY_DOCKER_USERNAME }}
          password: ${{ secrets.MY_DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t makdev85/svgcicd:latest .

      - name: Push Docker image
        run: |
          docker push makdev85/svgcicd:latest


  deploy-kubernetes:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Check Kubernetes cluster
        run: |
          kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/cicd-app \
            cicd-app=makdev85/svgcicd:latest

          kubectl rollout restart deployment/cicd-app

          kubectl rollout status deployment/cicd-app
