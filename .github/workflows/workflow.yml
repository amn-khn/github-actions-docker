name: Kubernetes CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOC_USERNAME }}
          password: ${{ secrets.DOC_PWD }}

      - name: Build Docker Image
        run: |
          docker build -t amxnkhxn/githubactions:latest .

      - name: Push Docker Image
        run: |
          docker push amxnkhxn/githubactions:latest

      - name: Configure Kubernetes
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KILLERCODA_SSH_KEY }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Verify Cluster
        run: kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/cicd-app \
            cicd-app=amxnkhxn/githubactions:latest

          kubectl rollout restart deployment/cicd-app
          kubectl rollout status deployment/cicd-app
