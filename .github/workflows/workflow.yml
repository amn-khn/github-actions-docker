name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOC_PWD }}" | docker login \
            -u "${{ secrets.DOC_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOC_USERNAME }}/github-actions-docker:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOC_USERNAME }}/github-actions-docker:latest

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.KILLERCODA_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.KILLERCODA_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Killercoda Kubernetes
        run: |
          ssh -i ~/.ssh/id_rsa -o IdentitiesOnly=yes root@${{ secrets.KILLERCODA_HOST }} << 'EOF'

          docker login -u "${{ secrets.DOC_USERNAME }}" -p "${{ secrets.DOC_PWD }}"
          docker pull ${{ secrets.DOC_USERNAME }}/github-actions-docker:latest

          kubectl delete deployment github-actions-docker --ignore-not-found=true
          kubectl delete service github-actions-docker --ignore-not-found=true

          kubectl create deployment github-actions-docker \
            --image=${{ secrets.DOC_USERNAME }}/github-actions-docker:latest

          kubectl expose deployment github-actions-docker \
            --type=NodePort --port=80 --target-port=80

          kubectl rollout status deployment/github-actions-docker

          EOF
